name: Release

# Obsidian tags are bare semver. `+` is a quantifier in GitHub's filter
# patterns, so `v1.2.3`, `1.2` and `1.2.3-beta` do not start a release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # jq is preinstalled on ubuntu-latest, so a mismatched tag fails in
      # seconds, before anything is installed.
      - name: Verify tag matches package.json, manifest.json and versions.json
        run: |
          tag="${GITHUB_REF_NAME}"
          for f in package.json manifest.json; do
            v="$(jq -r .version "$f")"
            [ "$tag" = "$v" ] || { echo "tag $tag != $f $v" >&2; exit 1; }
          done
          jq -e --arg t "$tag" 'has($t)' versions.json >/dev/null \
            || { echo "versions.json has no row for $tag" >&2; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build
      # The release asset must be the committed bundle, not a fresh one that
      # happens to differ from it.
      - run: git diff --exit-code main.js
      - run: bun test

      # styles.css is optional: a plugin that adds one ships it without
      # editing this list.
      - name: Collect assets
        id: assets
        run: |
          {
            echo "files<<EOF"
            echo main.js
            echo manifest.json
            if [ -f styles.css ]; then echo styles.css; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
